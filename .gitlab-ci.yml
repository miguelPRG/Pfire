stages:
  - test

variables:
  PYTHONPATH: "$CI_PROJECT_DIR/backend"
  VIRTUAL_ENV: "$CI_PROJECT_DIR/.venv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Job de teste do backend
python_test:
  image: python:3.11-slim
  stage: test
  script:
    # Instalar dependências comuns do sistema (somente para o backend)
    - apt-get update && apt-get install -y gcc libmariadb-dev pkg-config curl git && rm -rf /var/lib/apt/lists/

    # Configurar o ambiente do backend (Python)
    - cd backend
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install safety

    # Rodar os testes do backend com safety
    - safety check --full-report
  allow_failure: false
  # O pipeline falha caso vulnerabilidades sejam encontradas ou testes falhem

# Job de frontend com imagem Node.js separada
node_test:
  image: node:18-slim  # Usando a imagem para Node.js para o frontend
  stage: test
  script:
    - cd frontend  # Garantir que estamos no diretório do frontend
    - npm install  # Ou yarn install, se estiver usando yarn
    - npm audit  # Verificar vulnerabilidades nas dependências do frontend
  allow_failure: false
