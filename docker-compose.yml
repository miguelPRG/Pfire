services:
  backend:
    build: .
    container_name: backend
    restart: always
    env_file:
      - .env
    volumes:
      - /etc/secrets/:/etc/secrets:ro
    expose:
      - "10000"

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
